name: Refresh English research figures

on:
  push:
    branches:
      - "docs/english-figures-*"
    paths:
      - "run_analysis.py"
      - "run_audit_response.py"
      - ".github/workflows/regenerate-english-figures.yml"
      - "docs/FIGURE_INVENTORY.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    # Do not retrigger figure publication on workflow-created commits.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Rebuild charts and English decision report
        run: |
          python run_analysis.py
          python run_audit_response.py
          python verify_frozen_forecasts.py
          python -m unittest discover -s tests -v
      - name: Prepare current-image integrity manifest
        run: |
          sha256sum results/*.png evidence/independent_audit/structural_envelope.png > results/FIGURE_SHA256SUMS
      - name: Commit reviewed localization assets to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/decision_map.png results/evsi_surface.png results/structural_envelope.png results/RUN_REPORT.md results/FIGURE_SHA256SUMS
          if git diff --cached --quiet; then
            echo "The rendered figures already match this branch."
          else
            git commit -m "docs: refresh reproducible English figures [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
