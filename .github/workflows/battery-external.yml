name: Experimental battery external benchmark
on:
  push:
    branches:
      - research/nasa-battery-heldout-2026-10-09
  pull_request:
    paths:
      - research_battery_benchmark.py
      - docs/NASA_BATTERY_EXTERNAL_BENCHMARK.md
      - .github/workflows/battery-external.yml
  workflow_dispatch:
jobs:
  external-empirical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Test leakage guards and predictive computation
        run: python research_battery_benchmark.py --self-test
      - name: Evaluate 257 held-out measured discharge records
        run: python research_battery_benchmark.py
      - name: Preserve LV-01 forecast SHA256 exactly
        run: |
          echo 'fc9d0e290adef51459b86c8ad4a1a6ddc03ea087163e48da6e59f6d106f82d1f  forecast/reference.json' | sha256sum -c -
      - name: Archive independent test results
        uses: actions/upload-artifact@v4
        with:
          name: nasa-battery-external-benchmark
          path: results/battery_external/
