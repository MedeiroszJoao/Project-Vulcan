name: Independent NASA raw battery source audit
on:
  push:
    branches: [research/nasa-battery-heldout-2026-10-09]
    paths: [verify_nasa_raw_battery.py, .github/workflows/nasa-raw-audit.yml]
  workflow_dispatch:
jobs:
  compare-nasa-raw-with-processed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compare NASA original MAT measurements against pinned CSV
        run: python verify_nasa_raw_battery.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasa-raw-origin-audit-result
          path: results/battery_external/raw_source_crosscheck.json
          if-no-files-found: ignore
