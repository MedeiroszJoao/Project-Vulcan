name: Core numerical regression

on:
  push:
    branches:
      - main
      - "portfolio/**"
      - "research/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Model tests and immutable forecast verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify archived forecast bytes and recomputed numbers
        run: python verify_frozen_forecasts.py

      - name: Reproduce original decision calculations
        run: |
          python run_analysis.py
          python run_audit_response.py
          python independent_numeric_check.py
          python make_decision_brief.py
          python build_scores.py
          python check_candidate.py

      - name: Check original forecast again after reproduction
        run: python verify_frozen_forecasts.py

      - name: Preserve numeric outputs for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-numerical-output
          path: results/
          if-no-files-found: warn
